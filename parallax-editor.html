<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <title>Parallax Editor</title>
        <style>
            :root {
                --bg: #10151c;
                --p: #161d27;
                --p2: #1d2733;
                --b: #2a3646;
                --t: #dbe4ee;
                --m: #8696a8;
                --a: #25d4e0;
                --g: #1f7a45;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                height: 100vh;
                background: var(--bg);
                color: var(--t);
                font:
                    13px system-ui,
                    sans-serif;
                display: grid;
                grid-template: 44px 1fr 250px/270px 1fr 270px;
                overflow: hidden;
            }
            button,
            select,
            input {
                font: inherit;
                color: var(--t);
                background: var(--p2);
                border: 1px solid var(--b);
                border-radius: 5px;
                padding: 5px 9px;
            }
            button {
                cursor: pointer;
            }
            button:hover,
            button.on {
                border-color: var(--a);
            }
            button.on {
                background: #0e3a40;
            }
            header {
                grid-column: 1/4;
                display: flex;
                gap: 8px;
                align-items: center;
                padding: 0 10px;
                background: var(--p);
                border-bottom: 1px solid var(--b);
            }
            header b {
                margin-right: 8px;
            }
            .sp {
                flex: 1;
            }
            aside {
                background: var(--p);
                padding: 10px;
                overflow: auto;
                border-right: 1px solid var(--b);
            }
            #right {
                border: 0;
                border-left: 1px solid var(--b);
            }
            h4 {
                margin: 10px 0 6px;
                color: var(--m);
                font-weight: 600;
            }
            main {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                position: relative;
                min-width: 0;
                padding: 10px;
            }
            #cvw {
                position: relative;
                box-sizing: content-box;
                border: 2px solid var(--b);
            }
            canvas {
                width: 100%;
                height: 100%;
                image-rendering: pixelated;
                display: block;
                cursor: crosshair;
            }
            #hud {
                position: absolute;
                left: 8px;
                top: 8px;
                background: #000a;
                padding: 4px 10px;
                border-radius: 5px;
                pointer-events: none;
            }
            #tip {
                position: absolute;
                right: 8px;
                top: 8px;
                background: #000a;
                padding: 4px 10px;
                border-radius: 5px;
                pointer-events: none;
            }
            #tl {
                grid-column: 1/4;
                background: var(--p);
                border-top: 1px solid var(--b);
                overflow: auto;
            }
            table {
                border-collapse: collapse;
                min-width: 100%;
            }
            td,
            th {
                border: 1px solid var(--b);
                padding: 0;
                height: 30px;
            }
            th {
                background: var(--p2);
                font-weight: 500;
                position: sticky;
                top: 0;
                z-index: 2;
            }
            .lb {
                position: sticky;
                left: 0;
                background: var(--p);
                z-index: 1;
                min-width: 230px;
                padding: 0 8px;
                white-space: nowrap;
            }
            .lb.sel {
                outline: 1px solid var(--a);
                outline-offset: -1px;
            }
            .cell {
                min-width: 100px;
                width: 100px;
                cursor: pointer;
                overflow: hidden;
                position: relative;
            }
            .cell.cur {
                outline: 2px solid var(--a);
                outline-offset: -2px;
            }
            .cell img {
                width: 100%;
                height: 28px;
                object-fit: cover;
                display: block;
            }
            .pl {
                background: var(--g);
            }
            .cell span {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #fffc;
                font-size: 11px;
            }
            #th {
                display: grid;
                gap: 6px;
                margin-top: 8px;
            }
            .it {
                background: var(--p2);
                border: 1px solid var(--b);
                border-radius: 5px;
                text-align: center;
                font-size: 11px;
                cursor: pointer;
                padding: 3px;
                overflow: hidden;
                white-space: nowrap;
                text-overflow: ellipsis;
            }
            .it:hover {
                border-color: var(--a);
            }
            .it img {
                width: 100%;
                aspect-ratio: 1;
                object-fit: contain;
                image-rendering: pixelated;
                display: block;
            }
            .fd {
                padding: 3px 6px;
                cursor: pointer;
                border-radius: 4px;
            }
            .fd:hover,
            .fd.on {
                background: var(--p2);
                color: var(--a);
            }
            .row {
                display: flex;
                align-items: center;
                gap: 6px;
                margin: 5px 0;
            }
            .row label {
                width: 90px;
                color: var(--m);
            }
            .row input[type="text"],
            .row input[type="number"],
            .row select {
                flex: 1;
                min-width: 0;
            }
            .row input[type="range"] {
                flex: 1;
            }
            dialog {
                background: var(--p);
                color: var(--t);
                border: 1px solid var(--b);
                border-radius: 8px;
            }
            dialog::backdrop {
                background: #000a;
            }
            .wl {
                display: flex;
                gap: 6px;
                align-items: center;
                margin: 6px 0;
            }
            .wl span {
                flex: 1;
            }
        </style>
    </head>
    <body>
        <header>
            <b>▲ Parallax Editor</b> <button id="bNew">Novo projeto</button
            ><button id="bSel" class="on">Selecionar</button><button id="bCol">Colisão</button>
            <span id="colUi" style="display: none; gap: 8px; align-items: center"
                ><span id="gInfo"></span>Opacidade grid
                <input type="range" id="gop" min="0" max="1" step=".05" value=".5"
            /></span>
            <span class="sp"></span><button id="bPlay">▶ Pré-visualizar</button
            ><button id="bSheet" title="Baixa o spritesheet do personagem">⬇ Spritesheet</button>
            <button id="bDir" title="Escolher a pasta onde a pasta 'worlds' será criada">Pasta worlds</button
            ><button id="bWorlds">Mundos…</button><button id="bSave">💾 Salvar</button>
        </header>
        <aside>
            <b>Sources</b>
            <div class="row"><button id="bRoot" style="flex: 1">+ Pasta raiz</button></div>
            <input id="fi" type="file" webkitdirectory multiple hidden /><input
                id="q"
                type="text"
                placeholder="Buscar arquivos…"
                style="width: 100%"
            />
            <div id="tree" style="margin-top: 8px"></div>
            <div class="row">
                <input type="range" id="zs" min="50" max="140" value="80" /><button id="bList">☰</button>
            </div>
            <div id="th"></div>
        </aside>
        <main>
            <div id="cvw">
                <canvas id="cv" width="960" height="576"></canvas>
                <div id="hud"></div>
                <div id="tip"></div>
            </div>
        </main>
        <aside id="right">
            <b>Configuração da camada</b>
            <div id="lp"></div>
            <div id="op"></div>
        </aside>
        <div id="tl"></div>

        <dialog id="dNew">
            <form method="dialog">
                <b>Novo projeto</b>
                <div class="row"><label>Nome</label><input type="text" id="nName" value="Mundo 1" /></div>
                <div class="row">
                    <label>Tile / Grid</label
                    ><select id="nTile">
                        <option>32</option>
                        <option selected>64</option></select
                    ><span>px</span>
                </div>
                <div class="row"><label>Telas</label><input type="number" id="nN" value="10" min="1" max="60" /></div>
                <div class="row">
                    <span class="sp"></span><button type="button" onclick="dNew.close()">Cancelar</button
                    ><button type="button" id="nOk">Criar</button>
                </div>
            </form>
        </dialog>
        <dialog id="dW" style="min-width: 380px">
            <b>Mundos salvos</b>
            <div id="wl"></div>
            <div class="row"><span class="sp"></span><button onclick="dW.close()">Fechar</button></div>
        </dialog>

        <script>
            const $ = (i) => document.getElementById(i),
                W = 960,
                H = 576,
                GY = 448,
                uid = () => Math.random().toString(36).slice(2, 8);
            const cv = $("cv"),
                cx = cv.getContext("2d"),
                TY = { bg: "Background", obj: "Objetos", fg: "Foreground", player: "Jogador" };
            let hov = null,
                P,
                sel = { l: null, s: 0, o: null },
                tool = "sel",
                playing = false,
                imgs = {},
                srcs = [],
                folder = "",
                listV = false,
                dh = null,
                pl,
                keys = {},
                drag = null,
                paint = null;
            const L = (id) => P.layers.find((l) => l.id == id),
                curL = () => L(sel.l),
                curO = () => {
                    const l = curL();
                    return l && l.objs.find((o) => o.id == sel.o);
                };
            /* ---------- projeto ---------- */
            const mk = (name, type, par) => ({
                id: uid(),
                name,
                type,
                vis: true,
                op: 1,
                mode: type == "player" ? "none" : "follow",
                par,
                ox: 0,
                oy: 0,
                dir: -1,
                spd: 24,
                imgs: [],
                objs: [],
                _t: 0,
            });
            function newProject(name, tile, n) {
                P = {
                    name,
                    tile,
                    n,
                    col: new Set(),
                    layers: [
                        mk("Céu e montanhas", "bg", 0.1),
                        mk("Floresta distante", "bg", 0.3),
                        mk("Floresta próxima", "bg", 0.6),
                        mk("Jogador", "player", 1),
                        mk("Objetos", "obj", 1),
                        mk("Foreground", "fg", 1),
                    ],
                };
                sel = { l: P.layers[2].id, s: 0, o: null };
                all();
            }
            function serialize() {
                return JSON.stringify(
                    {
                        version: 1,
                        name: P.name,
                        tile: P.tile,
                        screen: { w: W, h: H },
                        screens: P.n,
                        grid: { cols: Math.ceil((P.n * W) / P.tile), rows: Math.ceil(H / P.tile), size: P.tile },
                        layers: P.layers.map(({ _t, ...l }) => l),
                        collision: [...P.col].map((s) => s.split(",").map(Number)),
                        playerStart: { x: W / 2, y: GY },
                    },
                    null,
                    1
                );
            }
            function load(j) {
                const d = typeof j == "string" ? JSON.parse(j) : j;
                P = {
                    name: d.name,
                    tile: d.tile,
                    n: d.screens,
                    col: new Set(d.collision.map((c) => c.join(","))),
                    layers: d.layers.map((l) => ({ _t: 0, ...l })),
                };
                sel = { l: P.layers[0].id, s: 0, o: null };
                all();
            }
            /* ---------- sources ---------- */
            $("bRoot").onclick = () => $("fi").click();
            $("fi").onchange = (e) => {
                srcs = [];
                imgs = {};
                for (const f of e.target.files) {
                    if (!/\.(png|jpe?g|gif|webp)$/i.test(f.name)) continue;
                    const p = f.webkitRelativePath,
                        im = new Image();
                    im.onload = () => draw();
                    im.src = URL.createObjectURL(f);
                    imgs[p] = im;
                    srcs.push({ p, url: im.src, name: f.name });
                }
                folder = srcs[0] ? srcs[0].p.split("/")[0] : "";
                srcTree();
                all();
            };
            const dirOf = (p) => p.split("/").slice(0, -1).join("/");
            function srcTree() {
                const fs = [...new Set(srcs.map((s) => dirOf(s.p)))].sort();
                $("tree").innerHTML = fs
                    .map(
                        (f) =>
                            `<div class="fd ${f == folder ? "on" : ""}" style="padding-left:${6 + 10 * (f.split("/").length - 1)}px" data-f="${f}">📁 ${f.split("/").pop()}</div>`
                    )
                    .join("");
                $("tree")
                    .querySelectorAll(".fd")
                    .forEach(
                        (d) =>
                            (d.onclick = () => {
                                folder = d.dataset.f;
                                srcTree();
                            })
                    );
                const q = $("q").value.toLowerCase(),
                    z = $("zs").value;
                $("th").style.gridTemplateColumns = listV ? "1fr" : `repeat(auto-fill,minmax(${z}px,1fr))`;
                $("th").innerHTML = srcs
                    .filter((s) => dirOf(s.p) == folder && s.name.toLowerCase().includes(q))
                    .map(
                        (s) =>
                            `<div class="it" draggable="true" data-p="${s.p}">${listV ? "" : `<img src="${s.url}">`}${s.name}</div>`
                    )
                    .join("");
                $("th")
                    .querySelectorAll(".it")
                    .forEach((d) => {
                        d.onclick = () => useSrc(d.dataset.p);
                        d.ondragstart = (e) => e.dataTransfer.setData("text/plain", "S:" + d.dataset.p);
                    });
            }
            $("q").oninput = $("zs").oninput = srcTree;
            $("bList").onclick = () => {
                listV = !listV;
                srcTree();
            };
            function useSrc(p, x, y) {
                const l = curL();
                if (!l) return;
                if (l.type == "bg") {
                    l.imgs[sel.s] = p;
                } else if (l.type != "player") {
                    const im = imgs[p],
                        w = im ? im.width : 64,
                        h = im ? im.height : 64;
                    const o = {
                        id: uid(),
                        src: p,
                        s: sel.s,
                        x: x != null ? x - w / 2 : W / 2 - w / 2,
                        y: y != null ? y - h / 2 : GY - h,
                        sc: 1,
                        rot: 0,
                    };
                    l.objs.push(o);
                    sel.o = o.id;
                }
                all();
            }
            /* ---------- desenho ---------- */
            const sheet = document.createElement("canvas");
            sheet.width = 128;
            sheet.height = 192;
            const R = (c, x, y, w, h, k) => {
                c.fillStyle = k;
                c.fillRect(x, y, w, h);
            };
            function ch(c, r, f) {
                const SK = "#f2c29b",
                    HR = "#6b3a1e",
                    SH = "#c0392b",
                    PN = "#34495e",
                    BT = "#4a2f1c",
                    E = "#222",
                    b = f % 2 && r < 4 ? 1 : 0,
                    s = [0, 3, 0, -3][f];
                if (r < 2) {
                    const a = f == 1 ? 2 : 0,
                        d = f == 3 ? 2 : 0;
                    R(c, 11, 22 - a, 4, 8, PN);
                    R(c, 17, 22 - d, 4, 8, PN);
                    R(c, 11, 28 - a, 4, 2, BT);
                    R(c, 17, 28 - d, 4, 2, BT);
                    R(c, 10, 12 - b, 12, 11, SH);
                    R(c, 8, 13 - b, 2, 8, SK);
                    R(c, 22, 13 - b, 2, 8, SK);
                    R(c, 11, 2 - b, 10, 10, SK);
                    if (r == 0) {
                        R(c, 10, 1 - b, 12, 4, HR);
                        R(c, 13, 7 - b, 2, 2, E);
                        R(c, 17, 7 - b, 2, 2, E);
                    } else R(c, 10, 1 - b, 12, 10, HR);
                } else if (r == 4) {
                    const d = f == 0 ? 5 : 0;
                    if (f == 0) R(c, 12, 26, 8, 4, PN);
                    else {
                        R(c, 13, 22, 3, f == 1 ? 6 : 8, PN);
                        R(c, 17, f == 1 ? 24 : 22, 3, 6, PN);
                    }
                    R(c, 12, 12 + d, 8, 11 - d / 2, SH);
                    R(c, 12, 2 + d, 9, 10, SK);
                    R(c, 11, 1 + d, 9, 4, HR);
                    R(c, 11, 1 + d, 3, 9, HR);
                    R(c, 19, 6 + d, 1, 2, E);
                    if (f) R(c, 16, 2, 3, 9, SK);
                } else {
                    const x = r == 3 ? 2 : 0,
                        att = r == 5;
                    R(c, 14 + (att ? 4 : s), 22, 4, 8, "#27394a");
                    R(c, 14 - (att ? 0 : s), 22, 4, 8, PN);
                    R(c, 12 + x, 12 - b, 8, 11, SH);
                    R(c, 12 + x, 2 - b, 9, 10, SK);
                    R(c, 11 + x, 1 - b, 9, 4, HR);
                    R(c, 11 + x, 1 - b, 3, 9, HR);
                    R(c, 19 + x, 6 - b, 1, 2, E);
                    if (att) {
                        const w = [
                            [10, 1, 2, 11],
                            [20, 1, 2, 11],
                            [20, 13, 11, 2],
                            [20, 19, 11, 2],
                        ][f];
                        R(c, 15, 13, f > 1 ? 5 : 3, 3, SK);
                        R(c, w[0], w[1], w[2], w[3], "#dfe6e9");
                        R(c, w[0], w[1] + (w[3] > w[2] ? w[3] - 2 : 0), 2, 2, "#f1c40f");
                    } else R(c, 14 + x - (s >> 1), 13 - b, 3, 8, SK);
                }
            }
            (() => {
                const c = sheet.getContext("2d");
                for (let r = 0; r < 6; r++)
                    for (let f = 0; f < 4; f++) {
                        if (r == 4 && f == 3) continue;
                        c.save();
                        c.translate(f * 32, r * 32);
                        ch(c, r, f);
                        c.restore();
                    }
            })();
            $("bSheet").onclick = () => {
                const a = document.createElement("a");
                a.href = sheet.toDataURL();
                a.download = "personagem_spritesheet_32x32.png";
                a.click();
            };
            const KS = {

            cv.onmousedown = (e) => {
                if (playing) return;
                if (tool == "col") {
                    paint = 1;
                    doPaint(e);
                    return;
                }
                const l = curL(),
                    m = mp(e);
                if (!l || l.type == "bg" || l.type == "player") return;
                sel.o = null;
                for (const o of [...l.objs].reverse()) {
                    if (o.s != sel.s) continue;
                    const { w, h } = ob(o);
                    if (m.x >= o.x && m.x <= o.x + w && m.y >= l.oy + o.y && m.y <= l.oy + o.y + h) {
                        sel.o = o.id;
                        drag = { o, dx: m.x - o.x, dy: m.y - o.y };
                        break;
                    }
                }
                all();
            };
            addEventListener("mousemove", (e) => {
                if (tool == "col" && !playing && e.target == cv) {
                    hov = cell(e);
                    if (!paint) draw();
                }
                if (paint) doPaint(e);
                if (drag) {
                    const m = mp(e);
                    drag.o.x = Math.round(m.x - drag.dx);
                    drag.o.y = Math.round(m.y - drag.dy);
                    draw();
                    objPanel();
                }
            });
            cv.onmouseleave = () => {
                hov = null;
                draw();
            };
            addEventListener("mouseup", () => {
                drag = null;
                paint = null;
            });
            cv.ondragover = (e) => e.preventDefault();
            cv.ondrop = (e) => {
                e.preventDefault();
                const t = e.dataTransfer.getData("text/plain");
                if (t[0] == "S") {
                    const m = mp(e);
                    useSrc(t.slice(2), m.x, m.y);
                }
            };
            /* ---------- timeline ---------- */
            function tl() {
                let h =
                    '<table><tr><th class="lb" style="z-index:3">' +
                    P.layers.length +
                    ' camadas <button onclick="addLayer()">+ Camada</button> <button onclick="addScreen()">+ Tela</button> <button onclick="delLayer()">🗑</button></th>';
                for (let i = 0; i < P.n; i++)
                    h += `<th class="${i == sel.s ? "cur" : ""}">${String(i + 1).padStart(2, "0")}</th>`;
                h += "</tr>";
                for (const l of [...P.layers].reverse()) {
                    h += `<tr><td class="lb ${l.id == sel.l ? "sel" : ""}" draggable="true" data-l="${l.id}"><span data-v="${l.id}" style="cursor:pointer">${l.vis ? "👁" : "—"}</span> ${l.type == "player" ? "🔒 " : ""}${l.name} <small style="color:var(--m)">${l.type == "player" ? "camada permanente" : "paralaxe " + l.par}</small></td>`;
                    for (let i = 0; i < P.n; i++) {
                        let c = "";
                        if (l.type == "player") c = "";
                        else if (l.type == "bg" && imgs[l.imgs[i]]) c = `<img src="${imgs[l.imgs[i]].src}">`;
                        else if (l.type != "bg") {
                            const n = l.objs.filter((o) => o.s == i).length;
                            if (n) c = `<span>${n} obj</span>`;
                        }
                        h += `<td class="cell ${l.type == "player" ? "pl" : ""} ${l.id == sel.l && i == sel.s ? "cur" : ""}" data-l="${l.id}" data-s="${i}">${c}</td>`;
                    }
                    h += "</tr>";
                }
                $("tl").innerHTML = h + "</table>";
                $("tl")
                    .querySelectorAll(".cell")
                    .forEach((c) => {
                        c.onclick = () => {
                            sel.l = c.dataset.l;
                            sel.s = +c.dataset.s;
                            sel.o = null;
                            all();
                        };
                        c.ondragover = (e) => e.preventDefault();
                        c.ondrop = (e) => {
                            e.preventDefault();
                            const t = e.dataTransfer.getData("text/plain");
                            if (t[0] == "S") {
                                sel.l = c.dataset.l;
                                sel.s = +c.dataset.s;
                                useSrc(t.slice(2));
                            }
                        };
                    });
                $("tl")
                    .querySelectorAll(".lb[data-l]")
                    .forEach((r) => {
                        r.onclick = () => {
                            sel.l = r.dataset.l;
                            sel.o = null;
                            all();
                        };
                        r.ondragstart = (e) => e.dataTransfer.setData("text/plain", "L:" + r.dataset.l);
                        r.ondragover = (e) => e.preventDefault();
                        r.ondrop = (e) => {
                            e.preventDefault();
                            const t = e.dataTransfer.getData("text/plain");
                            if (t[0] != "L") return;
                            const a = P.layers.findIndex((l) => l.id == t.slice(2)),
                                b = P.layers.findIndex((l) => l.id == r.dataset.l),
                                [m] = P.layers.splice(a, 1);
                            P.layers.splice(b, 0, m);
                            all();
                        };
                    });
                $("tl")
                    .querySelectorAll("[data-v]")
                    .forEach(
                        (s) =>
                            (s.onclick = (e) => {
                                e.stopPropagation();
                                const l = L(s.dataset.v);
                                l.vis = !l.vis;
                                all();
                            })
                    );
            }
            function addLayer() {
                const l = mk("Nova camada " + (P.layers.length + 1), "bg", 0.5);
                P.layers.push(l);
                sel.l = l.id;
                all();
            }
            function addScreen() {
                P.n++;
                all();
            }
            function delLayer() {
                const l = curL();
                if (!l || l.type == "player") return;
                P.layers = P.layers.filter((x) => x != l);
                sel.l = P.layers[0].id;
                all();
            }
            /* ---------- painel direito ---------- */
            const row = (lb, inner) => `<div class="row"><label>${lb}</label>${inner}</div>`;
            function panel() {
                const l = curL();
                if (!l) return;
                const pl_ = l.type == "player",
                    a = l.mode == "auto";
                $("lp").innerHTML =
                    row("Nome", `<input type="text" id="f_name" value="${l.name}">`) +
                    row(
                        "Tipo",
                        `<select id="f_type" ${pl_ ? "disabled" : ""}>${Object.entries(TY)
                            .filter(([k]) => k != "player" || pl_)
                            .map(
                                ([k, v]) => `<option value="${k}" ${k == l.type ? "selected" : ""}>${v}</option>`
                            )}</select>`
                    ) +
                    row("Opacidade", `<input type="range" id="f_op" min="0" max="1" step=".05" value="${l.op}">`) +
                    (pl_
                        ? '<p style="color:var(--m)">Camada permanente — arraste na lista para ficar entre fundo e foreground.</p>'
                        : `<h4>Movimento</h4>` +
                          row(
                              "Modo",
                              `<select id="f_mode"><option value="follow" ${l.mode == "follow" ? "selected" : ""}>Seguir personagem</option><option value="auto" ${a ? "selected" : ""}>Automático</option><option value="none" ${l.mode == "none" ? "selected" : ""}>Parado</option></select>`
                          ) +
                          row("Fator paralaxe", `<input type="number" id="f_par" step=".05" value="${l.par}">`) +
                          row("Offset X", `<input type="number" id="f_ox" value="${l.ox}">`) +
                          row("Offset Y", `<input type="number" id="f_oy" value="${l.oy}">`) +
                          row(
                              "Auto direção",
                              `<select id="f_dir" ${a ? "" : "disabled"}><option value="-1" ${l.dir < 0 ? "selected" : ""}>Esquerda</option><option value="1" ${l.dir > 0 ? "selected" : ""}>Direita</option></select>`
                          ) +
                          row(
                              "Velocidade",
                              `<input type="number" id="f_spd" value="${l.spd}" ${a ? "" : "disabled"}>`
                          ));
                const b = (id, k, f) => {
                    const e = $(id);
                    if (e)
                        e.oninput = () => {
                            l[k] = f ? f(e.value) : e.value;
                            if (k == "mode" || k == "type") all();
                            else {
                                draw();
                                tl();
                            }
                        };
                };
                b("f_name", "name");
                b("f_type", "type");
                b("f_op", "op", Number);
                b("f_mode", "mode");
                b("f_par", "par", Number);
                b("f_ox", "ox", Number);
                b("f_oy", "oy", Number);
                b("f_dir", "dir", Number);
                b("f_spd", "spd", Number);
                objPanel();
            }
            function objPanel() {
                const o = curO(),
                    el = $("op");
                if (!o || curL().type == "bg") {
                    el.innerHTML = "";
                    return;
                }
                if (el.dataset.o == o.id) {
                    ["sc", "x", "y", "rot"].forEach((k) => {
                        const e = $("o_" + k);
                        if (e && document.activeElement != e) e.value = o[k];
                    });
                    return;
                }
                el.dataset.o = o.id;
                el.innerHTML =
                    "<h4>Objeto selecionado</h4>" +
                    row("Arquivo", `<small>${o.src.split("/").pop()}</small>`) +
                    row("Escala", `<input type="number" id="o_sc" step=".1" value="${o.sc}">`) +
                    row("Posição X", `<input type="number" id="o_x" value="${o.x}">`) +
                    row("Posição Y", `<input type="number" id="o_y" value="${o.y}">`) +
                    row("Rotação", `<input type="number" id="o_rot" value="${o.rot}">`) +
                    '<div class="row"><button id="o_dup">Duplicar</button><button id="o_del">Excluir</button></div>';
                ["sc", "x", "y", "rot"].forEach(
                    (k) =>
                        ($("o_" + k).oninput = (e) => {
                            o[k] = +e.target.value || 0;
                            draw();
                        })
                );
                $("o_dup").onclick = () => {
                    const n = { ...o, id: uid(), x: o.x + 20 };
                    curL().objs.push(n);
                    sel.o = n.id;
                    all();
                };
                $("o_del").onclick = delObj;
            }
            function delObj() {
                const l = curL();
                if (!l || !sel.o) return;
                l.objs = l.objs.filter((o) => o.id != sel.o);
                sel.o = null;
                all();
            }
            function all() {
                if (!P) return;
                $("op").dataset.o = "";
                draw();
                tl();
                panel();
                srcTree();
                $("hud").textContent =
                    `${P.name} · Tela ${String(sel.s + 1).padStart(2, "0")} / ${String(P.n).padStart(2, "0")}`;
                $("gInfo").textContent = `Grid ${Math.ceil((P.n * W) / P.tile)}×${Math.ceil(H / P.tile)} · ${P.tile}px`;
                $("tip").textContent =
                    tool == "col"
                        ? "SHIFT+clique = adicionar · CTRL+clique = deletar"
                        : playing
                          ? "← → mover · Shift correr · Espaço pular · X espada · G colisão"
                          : "";
            }
            /* ---------- ferramentas ---------- */
            $("bSel").onclick = () => {
                tool = "sel";
                $("bSel").classList.add("on");
                $("bCol").classList.remove("on");
                $("colUi").style.display = "none";
                all();
            };
            $("bCol").onclick = () => {
                tool = "col";
                $("bCol").classList.add("on");
                $("bSel").classList.remove("on");
                $("colUi").style.display = "flex";
                all();
            };
            $("gop").oninput = draw;
            $("bNew").onclick = () => $("dNew").showModal();
            $("nOk").onclick = () => {
                if (playing) $("bPlay").click();
                newProject($("nName").value.trim() || "mundo", +$("nTile").value, Math.max(1, +$("nN").value || 10));
                $("dNew").close();
                $("tip").textContent = "Projeto criado: " + P.name + " (" + P.tile + "px)";
                setTimeout(all, 2500);
            };
            /* ---------- preview ---------- */
            const hit = (x, y) => {
                if (y > H) return true;
                if (!P.col.size) return y > GY;
                const g = P.tile,
                    c = PH();
                for (let a = Math.floor((x - c.hw) / g); a <= Math.floor((x + c.hw - 1) / g); a++)
                    for (let b = Math.floor((y - c.hh) / g); b <= Math.floor((y - 1) / g); b++)
                        if (P.col.has(a + "," + b)) return true;
                return false;
            };
            const toward = (v, t, d) => (v < t ? Math.min(t, v + d) : Math.max(t, v - d));
            function step() {
                const c = PH(),
                    k = c.k,
                    run = keys.Shift,
                    ax = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0),
                    atkOn = pl.atk > 0 && pl.g;
                if (pl.atk > 0) pl.atk--;
                if (pl.wa) {
                    pl.wa = 0;
                    if (pl.g && !pl.atk) {
                        pl.atk = 24;
                        pl.vx *= 0.3;
                    }
                }
                const tgt = atkOn ? 0 : ax * (run ? 3.6 : 2.2) * k;
                if (ax && !atkOn) pl.f = ax;
                pl.vx = toward(pl.vx, tgt, tgt ? (pl.g ? 0.45 : 0.25) * k : (pl.g ? 0.5 : 0.08) * k);
                pl.cy = pl.g ? 6 : pl.cy - 1;
                if (pl.jb > 0) {
                    pl.jb--;
                    if (pl.cy > 0 && !atkOn) {
                        pl.vy = -9.5 * k;
                        pl.cy = 0;
                        pl.jb = 0;
                        pl.g = false;
                    }
                }
                if (!keys[" "] && pl.vy < -3 * k) pl.vy = -3 * k;
                pl.vy = Math.min(pl.vy + 0.5 * k, 12 * k);
                let n = Math.max(1, Math.ceil(Math.abs(pl.vx)));
                for (let i = 0; i < n; i++) {
                    const nx = pl.x + pl.vx / n;
                    if (hit(nx, pl.y) || nx < c.hw || nx > P.n * W - c.hw) {
                        pl.vx = 0;
                        break;
                    }
                    pl.x = nx;
                }
                n = Math.max(1, Math.ceil(Math.abs(pl.vy)));
                pl.g = false;
                for (let i = 0; i < n; i++) {
                    const dy = pl.vy / n;
                    if (hit(pl.x, pl.y + dy)) {
                        if (dy > 0) {
                            pl.y = Math.floor((pl.y + dy - 1) / P.tile) * P.tile;
                            pl.g = true;
                        }
                        pl.vy = 0;
                        break;
                    }
                    pl.y += dy;
                }
                const an =
                    pl.atk > 0
                        ? "atk"
                        : !pl.g
                          ? pl.vy < 0
                              ? "jump"
                              : "fall"
                          : Math.abs(pl.vx) > 0.3
                            ? run && c.kn
                                ? "run"
                                : run
                                  ? "run"
                                  : "walk"
                            : !c.kn && keys.ArrowDown
                              ? "front"
                              : !c.kn && keys.ArrowUp
                                ? "back"
                                : "idle";
                if (an != pl.an) {
                    pl.an = an;
                    pl.t = 0;
                } else pl.t++;
                pl.cam += (Math.max(0, Math.min((P.n - 1) * W, pl.x - W / 2 + pl.f * 50)) - pl.cam) * 0.1;
                for (const l of P.layers) if (l.mode == "auto") l._t += (l.spd * l.dir) / 60;
            }
            let last = 0,
                acc = 0;
            function loop(ts) {
                if (!playing) return;
                if (!last) last = ts;
                acc += Math.min(100, ts - last);
                last = ts;
                while (acc >= 1000 / 60) {
                    step();
                    acc -= 1000 / 60;
                }
                draw();
                requestAnimationFrame(loop);
            }
            $("bPlay").onclick = () => {
                playing = !playing;
                $("bPlay").textContent = playing ? "■ Parar" : "▶ Pré-visualizar";
                if (playing) {
                    pl = {
                        x: sel.s * W + W / 2,
                        y: GY,
                        vx: 0,
                        vy: 0,
                        f: 1,
                        g: true,
                        cy: 6,
                        jb: 0,
                        wa: 0,
                        atk: 0,
                        t: 0,
                        an: "idle",
                        cam: sel.s * W,
                    };
                    last = 0;
                    acc = 0;
                    requestAnimationFrame(loop);
                } else P.layers.forEach((l) => (l._t = 0));
                all();
            };
            addEventListener("keydown", (e) => {
                if (e.target.tagName == "INPUT" || e.target.tagName == "SELECT") return;
                keys[e.key] = true;
                if (playing && !e.repeat) {
                    if (e.key == " ") pl.jb = 8;
                    if (e.key == "x" || e.key == "X") pl.wa = 1;
                }
                if (playing && [" ", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key))
                    e.preventDefault();
                if (!playing && (e.key == "Delete" || e.key == "Backspace")) delObj();
                if (e.key == "s" && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    save();
                }
                if (e.key == "g") draw();
            });
            addEventListener("keyup", (e) => (keys[e.key] = false));
            /* ---------- salvar / mundos ---------- */
            async function save() {
                const j = serialize();
                try {
                    localStorage.setItem("px:world:" + P.name, j);
                } catch (e) {
                    alert("localStorage cheio; use Pasta worlds");
                }
                if (dh) {
                    const f = await dh.getFileHandle(P.name + ".json", { create: true }),
                        w = await f.createWritable();
                    await w.write(j);
                    await w.close();
                }
                $("tip").textContent = "Salvo: worlds/" + P.name + ".json" + (dh ? "" : " (navegador)");
                setTimeout(all, 2500);
            }
            $("bSave").onclick = save;
            $("bDir").onclick = async () => {
                if (!window.showDirectoryPicker)
                    return alert("Use Chrome/Edge (ou Electron no futuro) para gravar na pasta.");
                const r = await showDirectoryPicker({ mode: "readwrite" });
                dh = await r.getDirectoryHandle("worlds", { create: true });
                $("bDir").classList.add("on");
            };
            async function worldList() {
                const n = new Set();
                for (let i = 0; i < localStorage.length; i++) {
                    const k = localStorage.key(i);
                    if (k.startsWith("px:world:")) n.add(k.slice(9));
                }
                if (dh) for await (const [k] of dh.entries()) if (k.endsWith(".json")) n.add(k.slice(0, -5));
                return [...n].sort();
            }
            $("bWorlds").onclick = async () => {
                const ns = await worldList();
                $("wl").innerHTML = ns.length
                    ? ns
                          .map(
                              (n) =>
                                  `<div class="wl"><span>🌍 ${n}</span><button data-a="l" data-n="${n}">Carregar</button><button data-a="d" data-n="${n}">Deletar</button><button data-a="x" data-n="${n}">⬇ JSON</button></div>`
                          )
                          .join("")
                    : "<p>Nenhum mundo salvo.</p>";
                $("wl")
                    .querySelectorAll("button")
                    .forEach(
                        (b) =>
                            (b.onclick = async () => {
                                const n = b.dataset.n;
                                let j = localStorage.getItem("px:world:" + n);
                                if (!j && dh) j = await (await (await dh.getFileHandle(n + ".json")).getFile()).text();
                                if (b.dataset.a == "l") {
                                    load(j);
                                    $("dW").close();
                                } else if (b.dataset.a == "x") {
                                    const a = document.createElement("a");
                                    a.href = URL.createObjectURL(new Blob([j]));
                                    a.download = n + ".json";
                                    a.click();
                                } else if (confirm("Deletar " + n + "?")) {
                                    localStorage.removeItem("px:world:" + n);
                                    if (dh)
                                        try {
                                            await dh.removeEntry(n + ".json");
                                        } catch (e) {}
                                    $("bWorlds").click();
                                }
                            })
                    );
                $("dW").showModal();
            };
            const fit = () => {
                const m = document.querySelector("main"),
                    s = Math.min((m.clientWidth - 28) / W, (m.clientHeight - 28) / H),
                    w = $("cvw");
                w.style.width = Math.floor(W * s) + "px";
                w.style.height = Math.floor(H * s) + "px";
            };
            new ResizeObserver(fit).observe(document.querySelector("main"));
            fit();
            newProject("Floresta", 64, 10);
        </script>
    </body>
</html>
